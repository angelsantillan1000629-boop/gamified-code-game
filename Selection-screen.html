<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Launcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      font-family: 'Space Grotesk', sans-serif;
      gap: 0;
    }

    h1 {
      color: #e2e2e8;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 48px;
      opacity: 0.5;
    }

    .btn-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
      border-radius: 18px;
      border: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      outline: none;
    }

    .btn:hover {
      transform: translateY(-6px) scale(1.04);
      filter: brightness(1.12);
    }

    .btn:active {
      transform: translateY(-2px) scale(1.01);
    }

    /* HTML button — fiery orange */
    .btn-html {
      background: linear-gradient(135deg, #e44d26 0%, #f16529 100%);
      color: #fff;
      box-shadow: 0 8px 32px rgba(228, 77, 38, 0.45);
    }
    .btn-html:hover {
      box-shadow: 0 14px 40px rgba(228, 77, 38, 0.6);
    }

    /* Java button — deep blue */
    .btn-java {
      background: linear-gradient(135deg, #1a6ebd 0%, #3a8fd4 100%);
      color: #fff;
      box-shadow: 0 8px 32px rgba(26, 110, 189, 0.45);
    }
    .btn-java:hover {
      box-shadow: 0 14px 40px rgba(26, 110, 189, 0.6);
    }

    /* CSS button — purple */
    .btn-css {
      background: linear-gradient(135deg, #663399 0%, #9b4dca 100%);
      color: #fff;
      box-shadow: 0 8px 32px rgba(102, 51, 153, 0.45);
    }
    .btn-css:hover {
      box-shadow: 0 14px 40px rgba(102, 51, 153, 0.6);
    }

    /* Icon above label */
    .btn span.icon {
      display: block;
      font-size: 2.2rem;
      margin-bottom: 8px;
      line-height: 1;
    }

    .btn span.label {
      display: block;
    }

    .btn-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <h1>Choose a Language</h1>

  <div class="btn-group">

    <!-- HTML button links to the local file -->
    <a
      class="btn btn-html"
      href="HTML-reviewer.html"
    >
      <div class="btn-inner">
        <span class="icon">🌐</span>
        <span class="label">HTML</span>
      </div>
    </a>

    <a
      class="btn btn-java"
      href="JAVA-reviewer.html"
    >
      <div class="btn-inner">
        <span class="icon">☕</span>
        <span class="label">Java</span>
      </div>
    </a>
       <a
      class="btn btn-css"
      href="cssReviewer.html"
    >
      <div class="btn-inner">
        <span class="icon">🎨</span>
        <span class="label">CSS</span>
      </div>
    </a>

  </div>

</body>
</html>
