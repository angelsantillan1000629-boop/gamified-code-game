<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syldrag Quest</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', serif;
    overflow: hidden;
    position: relative;
  }

  /* ============ VOLCANO BACKGROUND ============ */
  .bg-volcano {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .bg-volcano svg { width: 100%; height: 100%; display: block; }

  .glow-pulse { animation: glowPulse 3.2s ease-in-out infinite; }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }

  .lava-flicker { animation: lavaFlicker 2.4s ease-in-out infinite; }
  @keyframes lavaFlicker {
    0%, 100% { opacity: 0.9; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-2px); }
  }

  .smoke { animation: smokeDrift 9s ease-in-out infinite; transform-origin: center; }
  @keyframes smokeDrift {
    0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.35; }
    50% { transform: translateY(-40px) translateX(10px) scale(1.15); opacity: 0.15; }
    100% { transform: translateY(-90px) translateX(-6px) scale(1.3); opacity: 0; }
  }
  .smoke.s2 { animation-delay: 3s; }
  .smoke.s3 { animation-delay: 6s; }

  /* Floating embers */
  .embers {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .ember {
    position: absolute;
    bottom: -10px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffd27a 0%, #ff7a2e 60%, transparent 100%);
    box-shadow: 0 0 6px 2px rgba(255,140,40,0.6);
    animation: emberRise linear infinite;
  }
  @keyframes emberRise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(var(--drift, 30px)); opacity: 0; }
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    position: relative;
    z-index: 2;
  }

  .dragon-wrap {
    width: 340px;
    height: 340px;
    animation: dragonBob 2.8s ease-in-out infinite;
    filter: drop-shadow(0 0 22px rgba(80,160,255,0.45)) drop-shadow(0 0 60px rgba(255,120,40,0.25));
  }

  @keyframes dragonBob {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-14px); }
  }

  /* Wing flap */
  .wing-l { animation: flapL 1.6s ease-in-out infinite; transform-origin: 148px 150px; }
  .wing-r { animation: flapR 1.6s ease-in-out infinite; transform-origin: 152px 150px; }
  @keyframes flapL {
    0%,100% { transform: rotate(0deg); }
    50% { transform: rotate(-26deg); }
  }
  @keyframes flapR {
    0%,100% { transform: rotate(0deg); }
    50% { transform: rotate(26deg); }
  }

  /* Eye blink */
  .eye-l, .eye-r { animation: blink 4s ease-in-out infinite; }
  @keyframes blink {
    0%,92%,100% { transform: scaleY(1); }
    96% { transform: scaleY(0.08); }
  }
  .eye-l { transform-origin: 124px 108px; }
  .eye-r { transform-origin: 152px 108px; }

  /* Tail wag */
  .tail { animation: tailWag 2.4s ease-in-out infinite; transform-origin: 195px 215px; }
  @keyframes tailWag {
    0%,100% { transform: rotate(0deg); }
    50% { transform: rotate(12deg); }
  }

  /* Title */
  .title {
    color: #fff;
    font-size: 1.45rem;
    font-weight: bold;
    letter-spacing: 0.04em;
    text-align: center;
    text-shadow: 0 0 18px rgba(255,140,60,0.55);
    line-height: 1.35;
    max-width: 300px;
  }
  .title span {
    color: #5bc8ff;
  }

  /* Start Button */
  .start-btn {
    background: linear-gradient(135deg, #3a9eea, #1a6ec4);
    border: 2.5px solid #6dd0ff;
    color: #fff;
    font-family: 'Georgia', serif;
    font-size: 1.05rem;
    font-weight: bold;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 14px 58px;
    cursor: pointer;
    border-radius: 40px;
    outline: none;
    box-shadow: 0 0 20px rgba(60,160,255,0.4), 0 4px 14px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
  }
  .start-btn:hover {
    background: linear-gradient(135deg, #5bbbf7, #2a82d8);
    box-shadow: 0 0 36px rgba(80,180,255,0.65), 0 4px 18px rgba(0,0,0,0.5);
    transform: scale(1.05);
    letter-spacing: 0.26em;
  }
  .start-btn:active { transform: scale(0.97); }

  @media (prefers-reduced-motion: reduce) {
    .dragon-wrap, .wing-l, .wing-r, .eye-l, .eye-r, .tail, .ember, .smoke, .glow-pulse, .lava-flicker { animation: none; }
  }
</style>
</head>
<body>

<!-- ============ VOLCANO BACKGROUND ============ -->
<div class="bg-volcano">
  <svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#05030a"/>
        <stop offset="45%" stop-color="#170a10"/>
        <stop offset="75%" stop-color="#3a1208"/>
        <stop offset="100%" stop-color="#5a1c08"/>
      </linearGradient>
      <radialGradient id="craterGlow" cx="50%" cy="30%" r="60%">
        <stop offset="0%" stop-color="#ffdf8a" stop-opacity="0.95"/>
        <stop offset="35%" stop-color="#ff8a2e" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#ff8a2e" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2a1410"/>
        <stop offset="100%" stop-color="#120608"/>

      <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">

        <stop offset="70%" stop-color="#ff5a1e"/>

      </linearGradient>
    </defs>

    <!-- sky -->
    <rect x="0" y="0" width="800" height="800" fill="url(#sky)"/>

    <!-- stars -->

      <circle cx="700" cy="80" r="1.6"/>
      <circle cx="640" cy="150" r="1"/>

      <circle cx="760" cy="230" r="1.3"/>
      <circle cx="400" cy="50" r="1.1"/>
      <circle cx="500" cy="130" r="1.4"/>
      <circle cx="220" cy="90" r="1"/>
    </g>

    <!-- distant mountain range -->
    <path d="M0,520 L90,470 L150,510 L230,440 L300,500 L380,460 L460,505 L540,455 L620,500 L700,465 L800,510 L800,800 L0,800 Z" fill="#1a0c0c" opacity="0.85"/>

    <path d="M400,190 L470,320 L330,320 Z" fill="#3a1810"/>

    <!-- lava cracks down the slope -->
    <g class="lava-flicker" stroke-linecap="round" fill="none">
      <path d="M400,210 C388,260 402,300 380,350 C365,390 390,420 372,470 C360,505 380,530 365,555" stroke="url(#lava)" stroke-width="7"/>
      <path d="M405,215 C420,270 405,310 428,355 C445,395 420,430 438,475 C450,505 432,530 448,555" stroke="url(#lava)" stroke-width="5"/>
      <path d="M400,205 C398,240 405,265 398,290" stroke="url(#lava)" stroke-width="4"/>
    </g>

    <!-- crater lava pool -->
    <ellipse class="lava-flicker" cx="400" cy="200" rx="55" ry="16" fill="url(#lava)"/>

    <!-- smoke plumes -->
    <ellipse class="smoke" cx="390" cy="180" rx="30" ry="20" fill="#2a2020" opacity="0.4"/>
    <ellipse class="smoke s2" cx="410" cy="175" rx="24" ry="16" fill="#2a2020" opacity="0.35"/>
    <ellipse class="smoke s3" cx="400" cy="185" rx="36" ry="22" fill="#2a2020" opacity="0.3"/>

    <!-- foreground rocky silhouette -->
    <path d="M0,650 C80,610 140,650 220,620 C300,600 360,650 440,615 C520,590 600,640 680,610 C740,590 780,620 800,610 L800,800 L0,800 Z" fill="#0a0404"/>
  </svg>
</div>

<!-- Floating embers -->
<div class="embers" id="embers"></div>

<div class="stage">

      <!-- === BODY === -->

      <!-- Stripe lines -->

        <path d="M92,168 C56,146 22,140 -8,150" stroke="#c03030" stroke-width="1" fill="none" opacity="0.5"/>
        <path d="M80,182 C54,180 30,190 12,206" stroke="#c03030" stroke-width="1" fill="none" opacity="0.5"/>
        <path d="M104,160 C60,128 10,100 -55,55" stroke="#a02020" stroke-width="2.2" fill="none"/>

      <g class="wing-r">

                 C236,196 212,180 192,168 Z"
              fill="url(#wingRed)" stroke="#901818" stroke-width="1.6" opacity="0.94"/>
        <path d="M200,155 C242,122 288,98 340,64" stroke="#c03030" stroke-width="1" fill="none" opacity="0.5"/>
        <path d="M208,168 C244,146 278,140 308,150" stroke="#c03030" stroke-width="1" fill="none" opacity="0.5"/>
        <path d="M220,182 C246,180 270,190 288,206" stroke="#c03030" stroke-width="1" fill="none" opacity="0.5"/>
        <path d="M196,160 C240,128 290,100 355,55" stroke="#a02020" stroke-width="2.2" fill="none"/>
      </g>

      <!-- === NECK === -->
      <path d="M120,148 C122,128 130,115 140,106 C150,115 165,125 178,148 Z"
            fill="url(#bodyBlue)" stroke="#1a6aaa" stroke-width="1.5"/>

      <!-- === HEAD === -->
      <ellipse cx="148" cy="94" rx="46" ry="40" fill="url(#headBlue)" stroke="#1a6aaa" stroke-width="1.8" filter="url(#softShadow)"/>

      <!-- Cheek blush -->
      <ellipse cx="115" cy="106" rx="12" ry="7" fill="#ff9aaa" opacity="0.38"/>
      <ellipse cx="181" cy="106" rx="12" ry="7" fill="#ff9aaa" opacity="0.38"/>

      <!-- Snout bump -->
      <ellipse cx="148" cy="118" rx="24" ry="16" fill="#3aaae8" stroke="#1a6aaa" stroke-width="1.2"/>

      <!-- Nostrils -->

      <!-- Smile -->

      <!-- Ear frills -->
      <path d="M106,76 C94,64 90,50 96,38 C102,52 105,64 108,76 Z"
            fill="#2a8ad0" stroke="#1a6aaa" stroke-width="1"/>

            fill="#2a8ad0" stroke="#1a6aaa" stroke-width="1"/>

      <!-- Pupils (blink) -->

      <!-- === ARMS === -->

      <!-- Left claws -->

      <!-- Right claws -->

      <!-- Right leg -->

      <path d="M184,312 C188,322 187,332 182,334 C181,326 178,320 172,315 Z" fill="#1a6aaa"/>

      <!-- Spine spikes (small blue) -->
      <path d="M148,56 C145,44 144,36 148,26 C151,36 152,44 150,56 Z" fill="#d8eeff" stroke="#aaccee" stroke-width="0.8"/>
      <path d="M148,134 C144,124 142,115 145,106" stroke="#2a8ad0" stroke-width="2" fill="none" opacity="0.5"/>
    </svg>
  </div>

  <!-- Title -->
  <h1 class="title"><span>MENTISCODE<br>Quest</h1>

  <!-- Start Button -->
  <button class="start-btn" onclick="window.location.href='Selection-screen.html'">Start</button>
</div>

<script>
  // Generate floating embers
  const emberField = document.getElementById('embers');
  const emberCount = 24;
  for (let i = 0; i < emberCount; i++) {
    const ember = document.createElement('div');
    ember.className = 'ember';
    const left = Math.random() * 100;
    const size = 2 + Math.random() * 3; 
    const duration = 5 + Math.random() * 6;
    const delay = Math.random() * 8;
    const drift = (Math.random() * 80 - 40) + 'px';
    ember.style.left = left + 'vw';
    ember.style.width = size + 'px';
    ember.style.height = size + 'px';
    ember.style.animationDuration = duration + 's';
    ember.style.animationDelay = delay + 's';
    ember.style.setProperty('--drift', drift);
    emberField.appendChild(ember);
  }
</script>

</body>
</html>
